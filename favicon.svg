<!-- The browser-tab version of logo.svg. At 16 to 32 pixels fine detail turns to mush, so this one
     draws the brain as a solid shape with fewer, thicker rays, and the times sign and the die's pips a little heavier. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 86 86">
  <rect x="5" y="5" width="40" height="40" rx="9" fill="#E0602A"/>
  <path transform="translate(1 1.5) scale(0.5)" d="M48 16c10 14 22 22 22 40a22 22 0 0 1-44 0c0-10 4-18 11-24 0 10 3 15 8 19 4-8 5-22 3-35z" fill="#FFF4E3"/>
  <rect x="51" y="5" width="40" height="40" rx="9" fill="#1E3A5F"/>
  <path d="M62 16l18 18M80 16L62 34" stroke="#FFF4E3" stroke-width="7" stroke-linecap="round"/>
  <rect x="5" y="51" width="40" height="40" rx="9" fill="#F2B84B"/>
  <circle cx="16" cy="62" r="4.2" fill="#1E3A5F"/><circle cx="34" cy="62" r="4.2" fill="#1E3A5F"/><circle cx="25" cy="71" r="4.2" fill="#1E3A5F"/><circle cx="16" cy="80" r="4.2" fill="#1E3A5F"/><circle cx="34" cy="80" r="4.2" fill="#1E3A5F"/>
  <!-- Brain tile, simplified for tab size: a solid brain shape with one groove and the cerebellum set off,
       and seven thicker rays instead of eleven thin ones. The folds of logo.svg turn to noise this small. -->
  <rect x="51" y="51" width="40" height="40" rx="9" fill="#2F6F62"/>
  <g transform="translate(71 71) scale(0.25) translate(-50 -52)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 60L64 60L62 84Q58 88 53 84Z" fill="#FFF4E3"/>
    <ellipse cx="73" cy="67" rx="14" ry="9" fill="#FFF4E3" stroke="#2F6F62" stroke-width="5"/>
    <g fill="#FFF4E3" stroke="#FFF4E3" stroke-width="5.6"><ellipse cx="50" cy="44" rx="38" ry="22"/><circle cx="20.1" cy="40.5" r="13"/><circle cx="26.0" cy="31.8" r="13"/><circle cx="39.2" cy="26.1" r="13"/><circle cx="55.7" cy="25.3" r="13"/><circle cx="70.5" cy="29.6" r="13"/><circle cx="79.0" cy="37.6" r="13"/><ellipse cx="40" cy="58" rx="22" ry="10"/></g>
    <path d="M14 56Q36 46 64 50" fill="none" stroke="#2F6F62" stroke-width="6"/>
    <path d="M-6.0 52.0L-20.0 52.0M7.1 16.0L-3.6 7.0M26.3 1.2L20.4 -11.4M50.0 -4.0L50.0 -18.0M73.7 1.2L79.6 -11.4M92.9 16.0L103.6 7.0M106.0 52.0L120.0 52.0" stroke="#FFF4E3" stroke-width="7"/>
  </g>
</svg>
